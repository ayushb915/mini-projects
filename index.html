<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Mini Projects</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
      padding: 40px 20px;
    }
    h1 { text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 40px; }
    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }
    .card h2 { font-size: 20px; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #555; }
    .tag { display: inline-block; margin-top: 12px; font-size: 12px; color: #3b5bdb; }
  </style>
</head>
<body>

  <h1>My Mini Projects</h1>
  <p class="subtitle">Built with HTML, CSS and JavaScript</p>

  <div class="grid">

    <a class="card" href="Calculator/">
      <h2>Calculator</h2>
      <p>A calculator that handles multiple operations.</p>
      <span class="tag">HTML · CSS · JS</span>
    </a>

  </div>

</body>
</html>
